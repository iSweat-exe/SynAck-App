[package]
name = "synack"
version = "0.1.0"
description = "SynAck: learn programming by doing, on your desktop"
authors = []
edition = "2024"
rust-version = "1.99.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "synack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
which = "8.0.6"
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["process", "time", "io-util", "rt", "net", "sync", "macros"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
fastrand = "2.5.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
getrandom = "0.4.3"
sha2 = "0.11.1"
base64 = "0.23.1"
url = "2.5.8"
opener = "0.9.0"


[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Errors are returned to the front end, never unwrapped (see CLAUDE.md, "Architecture").
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
module_name_repetitions = "allow"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }

# The updater and the restart after it exist on desktop only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target."cfg(windows)".dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
winreg = "0.56.0"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
